<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cornell Quick Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/notes.js"></script>
</head>

<body>
  
  <div class="container-fluid">
    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle">
    <div class="row">
      <!-- Resizable sidebar panel -->
      <div class="col-md-2 sidebar text-center">
        <label for="sidebar-toggle" class="btn btn-sm btn-primary mb-3">Toggle Sidebar</label>
        <div class="sidebar-content">
          <form id="add-note-form" onsubmit="return addNote();">
            <div class="input-group mb-3">
              <input type="text" id="note" name="note" class="form-control" placeholder="Add a new note" required>
              <button class="btn btn-primary" id="add-note-btn" type="submit">Add Note</button>
            </div>
          </form>
          <div class="sidebar-scroll">
            <ul id="notes-list" class="list-group hidden">
              <!-- Existing notes will be populated here -->
               {% for note in notes %}
               <li class="list-group-item d-flex justify-content-between align-items-center" data-note-id="{{ note.id }}">
                <button class="btn-primary">{{ note.title}}</button> 
                <button class="btn btn-danger btn-sm" onclick="deleteNote(this)">Delete</button>
               </li>
               {% endfor %}
            </ul>
          </div>
        </div>
      </div>

      <!-- Main content area -->
      <div class="col-md-10 main-content">
        <header class="text-center">
          <h1>Cornell Quick Notes</h1>
        </header>
        
        <div class="cornell-container">
          <div class="cornell-header">
            <div class="row g-2">
              <div class="col-md-3">
                <label for="class">Class:</label>
                <input type="text" class="form-control" id="class" disabled>
              </div>
              <div class="col-md-3">
                <label for="date">Date:</label>
                <input type="date" class="form-control" id="date" disabled>
              </div>
              <div class="col-md-6">
                <label for="topic">Topic:</label>
                <input type="text" class="form-control" id="topic" disabled>
              </div>
            </div>
          </div><br>
          
          <div class="cornell-body">
            <div class="main-points-column">
              <h5>Main Points</h5>
              <textarea class="form-control" id="main-points" disabled></textarea>
            </div><br>
            
            <div class="notes-column">
              <h5>Notes</h5>
              <textarea class="form-control" id="notes" disabled></textarea>
            </div>
          </div><br>
          
          <div class="summary-section">
            <h5>Summary</h5>
            <textarea class="form-control" id="summary" disabled></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="saving-indicator" class="saving-indicator">Saving...</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
