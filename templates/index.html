<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cornell Quick Notes</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- SimpleMDE -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
    
    <!-- Brutopia -->
    <link href="https://cdn.jsdelivr.net/gh/rajnandan1/brutopia@latest/dist/assets/compiled/css/app.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="overlay"></div>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <div class="sidebar-content">
                    <form id="add-note-form" onsubmit="return addNote();">
                        <div class="input-group mb-3">
                            <input type="text" id="note" class="form-control" placeholder="Add new note" required>
                            <button class="btn btn-success" type="submit">Add</button>
                        </div>
                    </form>
                    <div class="notes-list">
                        <ul id="notes-list" class="list-group">
                            {% for note in notes %}
                                {% include 'note_item.html' %}
                            {% endfor %}
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <!-- <h1 class="text-center">Current Note Selected</h1> -->
                <div class="cornell-container">
                    <!-- Header -->
                    <div class="cornell-header mb-3">
                        <div class="row g-2">
                            <div class="col-md-3">
                                <label for="class">Class:</label>
                                <input type="text" class="form-control" id="class" disabled>
                            </div>
                            <div class="col-md-3">
                                <label for="date">Date:</label>
                                <input type="date" class="form-control" id="date" disabled>
                            </div>
                            <div class="col-md-6">
                                <label for="topic">Topic:</label>
                                <input type="text" class="form-control" id="topic" disabled>
                            </div>
                        </div>
                    </div>

                    <!-- Note Content -->
                    <div class="card">
                        <div class="card-body">
                            <ul class="nav nav-tabs" role="tablist">
                                <li class="nav-item">
                                    <a class="nav-link active" data-bs-toggle="tab" href="#main-points">Main Points</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" data-bs-toggle="tab" href="#notes">Notes</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" data-bs-toggle="tab" href="#summary">Summary</a>
                                </li>
                            </ul>

                            <div class="tab-content mt-3">
                                <div class="tab-pane fade show active" id="main-points">
                                    <textarea id="main-points-editor"></textarea>
                                </div>
                                <div class="tab-pane fade" id="notes">
                                    <textarea id="notes-editor"></textarea>
                                </div>
                                <div class="tab-pane fade" id="summary">
                                    <textarea id="summary-editor"></textarea>
                                </div>
                            </div>
                            
                            <!-- Export Button -->
                            <div class="mt-3">
                                <button id="export-note" class="btn btn-success w-100">
                                    Export Note
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="saving-indicator" class="saving-indicator">Saving...</div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
    <script src="/static/js/notes.js"></script>
</body>
</html>
